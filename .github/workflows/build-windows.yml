name: Build Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  installer:
    name: Windows installer (unsigned)
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: pilo-windows
          cache-on-failure: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create resource dirs
        run: New-Item -ItemType Directory -Force dist, src-tauri/resources | Out-Null

      - name: Build pilo-server runtime resource
        shell: cmd
        run: scripts\build-pilo-server.cmd

      - name: Build Tauri app
        env:
          # Diagnostic build: only the Windows server runtime is staged;
          # release bundles for all platforms remain the release workflow's job.
          PILO_ALLOW_INCOMPLETE_SERVER_BUNDLE: "1"
          # createUpdaterArtifacts=false skips updater signing so no
          # TAURI_SIGNING_PRIVATE_KEY is needed for this diagnostic artifact.
          TAURI_CONFIG: '{"bundle":{"createUpdaterArtifacts":false}}'
        run: pnpm tauri build

      - name: Upload installer bundle
        uses: actions/upload-artifact@v4
        with:
          name: pilo-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
