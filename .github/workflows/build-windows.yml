name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [feature/workspace-lock-guard]
    paths:
      - "src-tauri/**"
      - "src/**"
      - "crates/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  installer:
    name: Windows installer (unsigned)
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: pilo-windows-installer

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build pilo-server runtime resource
        shell: cmd
        run: scripts\build-pilo-server.cmd

      - name: Build Tauri app
        run: pnpm tauri build

      - name: Upload installer bundle
        uses: actions/upload-artifact@v4
        with:
          name: pilo-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
